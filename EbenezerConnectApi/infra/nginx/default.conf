server {
    listen 80;
    server_name ebenezerconnect.store www.ebenezerconnect.store;

    return 301 https://ebenezerconnect.store$request_uri;
}

server {
    listen 443 ssl;
    server_name ebenezerconnect.store www.ebenezerconnect.store;

    ssl_certificate /etc/letsencrypt/live/ebenezerconnect.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ebenezerconnect.store/privkey.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /swagger/ {
        proxy_pass http://api:5000/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
