version: "3.9"

services:
  api:
    build:
      context: ./EbenezerConnectApi
      dockerfile: Dockerfile
    container_name: ebenezer-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      EmailSettings__From: ${EmailSettings__From}
      EmailSettings__Password: ${EmailSettings__Password}
      AppSettings__BaseUrl: ${AppSettings__BaseUrl}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-}
      SeedAdmin__Enabled: ${SeedAdmin__Enabled:-false}
      SeedAdmin__Name: ${SeedAdmin__Name:-Admin}
      SeedAdmin__Email: ${SeedAdmin__Email:-admin@example.com}
      SeedAdmin__Password: ${SeedAdmin__Password:-CHANGE_ME_STRONG_PASSWORD}
      SeedAdmin__Cpf: ${SeedAdmin__Cpf:-00000000000}
    expose:
      - "5000"

  web:
    build:
      context: ./ebenezer-connect-web
      dockerfile: Dockerfile
    container_name: ebenezer-web
    restart: unless-stopped
    environment:
      PORT: 4000
    expose:
      - "4000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: ebenezer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
