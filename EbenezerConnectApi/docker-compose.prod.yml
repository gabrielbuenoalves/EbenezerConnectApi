version: "3.9"

services:
  api:
    build:
      context: ./EbenezerConnectApi
      dockerfile: Dockerfile
    container_name: ebenezer-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      EmailSettings__From: ${EMAIL_FROM}
      EmailSettings__Password: ${EMAIL_PASSWORD}
      AppSettings__BaseUrl: ${APP_BASE_URL}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
    expose:
      - "5000"

  web:
    build:
      context: ./ebenezer-connect-web
      dockerfile: Dockerfile
    container_name: ebenezer-web
    restart: unless-stopped
    environment:
      PORT: 4000
    expose:
      - "4000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: ebenezer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
