name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/EbenezerConnectApi/EbenezerConnectApi

            echo "==> Pulling latest changes..."
            git pull origin main

            echo "==> Freeing space before the image build..."
            docker builder prune -af
            docker image prune -f
            df -h /

            echo "==> Building API..."
            docker compose -f docker-compose.prod.yml --env-file .env build api
            docker builder prune -af
            docker image prune -f
            df -h /

            echo "==> Building web..."
            docker compose -f docker-compose.prod.yml --env-file .env build web
            docker builder prune -af
            df -h /

            echo "==> Restarting containers..."
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            echo "==> Removing unused images..."
            docker image prune -f

            echo "==> Deploy complete."
